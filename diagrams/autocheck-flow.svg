<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="520" fill="#0f172a"/>
  <text x="410" y="32" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">Поток автопроверки (асинхронный)</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <g font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    <rect x="40"  y="56" width="140" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="81">Участник</text>
    <rect x="240" y="56" width="140" height="40" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="310" y="81">Backend</text>
    <rect x="440" y="56" width="140" height="40" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <text x="510" y="81">Очередь</text>
    <rect x="640" y="56" width="140" height="40" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="710" y="81">Worker</text>
  </g>
  <g stroke="#334155" stroke-width="2" stroke-dasharray="4,4">
    <line x1="110" y1="96" x2="110" y2="480"/>
    <line x1="310" y1="96" x2="310" y2="480"/>
    <line x1="510" y1="96" x2="510" y2="480"/>
    <line x1="710" y1="96" x2="710" y2="480"/>
  </g>

  <g font-size="11" fill="#94a3b8">
    <!-- PUT /code -->
    <line x1="110" y1="130" x2="305" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <text x="120" y="124">PUT /code (артефакт)</text>
    <!-- upsert -->
    <rect x="270" y="142" width="80" height="34" rx="6" fill="#1e293b" stroke="#a78bfa"/>
    <text x="310" y="163" text-anchor="middle" fill="#e2e8f0">upsert · running</text>
    <!-- enqueue -->
    <line x1="310" y1="190" x2="505" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <text x="330" y="184">enqueue</text>
    <!-- 200 running -->
    <line x1="305" y1="220" x2="115" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <text x="150" y="214" fill="#34d399">200 (running)</text>
    <!-- queue -> worker task -->
    <line x1="510" y1="250" x2="705" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <text x="540" y="244">задача</text>
    <!-- worker job box -->
    <rect x="640" y="262" width="150" height="86" rx="6" fill="#1e293b" stroke="#22d3ee"/>
    <text x="715" y="284" text-anchor="middle" fill="#e2e8f0">check_code()</text>
    <text x="715" y="304" text-anchor="middle">GitHub API · flake8</text>
    <text x="715" y="322" text-anchor="middle">radon · secrets</text>
    <text x="715" y="340" text-anchor="middle">sandbox-тесты</text>
    <!-- poll GET /checks -->
    <line x1="110" y1="380" x2="305" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <text x="120" y="374">GET /checks (polling)</text>
    <!-- worker -> backend update -->
    <line x1="710" y1="410" x2="315" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <text x="430" y="404">update CheckResult · status, score</text>
    <!-- backend -> participant final -->
    <line x1="305" y1="450" x2="115" y2="450" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <text x="140" y="444" fill="#34d399">[passed / failed, score]</text>
  </g>
</svg>
