<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="470" fill="#0f172a"/>
  <text x="410" y="32" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">Развёртывание — docker compose</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- host boundary -->
  <rect x="30" y="52" width="760" height="392" rx="14" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="48" y="76" fill="#64748b" font-size="13">Docker host · docker compose up --build</text>

  <!-- frontend -->
  <rect x="60" y="100" width="200" height="74" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="128" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">frontend</text>
  <text x="160" y="148" fill="#94a3b8" font-size="12" text-anchor="middle">Nginx · React</text>
  <text x="160" y="165" fill="#fbbf24" font-size="12" text-anchor="middle">:3000</text>

  <!-- backend -->
  <rect x="310" y="100" width="200" height="74" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="410" y="128" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">backend</text>
  <text x="410" y="148" fill="#94a3b8" font-size="12" text-anchor="middle">FastAPI · seed.py</text>
  <text x="410" y="165" fill="#fbbf24" font-size="12" text-anchor="middle">:8000</text>

  <!-- worker -->
  <rect x="560" y="100" width="200" height="74" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="660" y="128" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">worker</text>
  <text x="660" y="148" fill="#94a3b8" font-size="12" text-anchor="middle">Celery</text>
  <text x="660" y="165" fill="#64748b" font-size="12" text-anchor="middle">без порта</text>

  <!-- db -->
  <rect x="185" y="250" width="200" height="74" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="285" y="278" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">db</text>
  <text x="285" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">PostgreSQL 16</text>
  <text x="285" y="315" fill="#94a3b8" font-size="12" text-anchor="middle">vol: postgres_data</text>

  <!-- redis -->
  <rect x="435" y="250" width="200" height="74" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="535" y="278" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">redis</text>
  <text x="535" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">брокер задач</text>
  <text x="535" y="315" fill="#94a3b8" font-size="12" text-anchor="middle">+ результаты</text>

  <!-- volume uploads -->
  <rect x="60" y="250" width="100" height="74" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="110" y="282" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">uploads</text>
  <text x="110" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">_data</text>

  <!-- edges -->
  <line x1="260" y1="137" x2="305" y2="137" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>
  <text x="262" y="128" fill="#94a3b8" font-size="10">proxy /api</text>
  <line x1="410" y1="174" x2="320" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="450" y1="174" x2="520" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="640" y1="174" x2="560" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="660" y1="174" x2="320" y2="250" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#a3)"/>
  <line x1="360" y1="174" x2="150" y2="250" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#a3)"/>
  <line x1="610" y1="174" x2="150" y2="252" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#a3)"/>

  <text x="410" y="400" fill="#64748b" font-size="12" text-anchor="middle">backend и worker монтируют общий том uploads_data · схема БД: create_all + migrate.py при старте</text>
</svg>
