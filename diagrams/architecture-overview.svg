<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="560" fill="#0f172a"/>
  <text x="410" y="34" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">JUDGE — общая архитектура</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="290" y="60" width="240" height="62" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="410" y="86" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Браузер — React SPA (Nginx)</text>
  <text x="410" y="106" fill="#94a3b8" font-size="12" text-anchor="middle">localhost:3000</text>

  <!-- arrow browser -> backend -->
  <line x1="410" y1="122" x2="410" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="424" y="150" fill="#94a3b8" font-size="11">HTTPS / REST · JWT Bearer · /api/* · /uploads/*</text>

  <!-- Backend -->
  <rect x="250" y="170" width="320" height="78" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="410" y="196" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Backend — FastAPI (uvicorn)</text>
  <text x="410" y="216" fill="#94a3b8" font-size="12" text-anchor="middle">localhost:8000 · роутеры /api/*</text>
  <text x="410" y="234" fill="#94a3b8" font-size="12" text-anchor="middle">авторизация (JWT) · выдача файлов /uploads</text>

  <!-- arrows backend -> infra -->
  <line x1="320" y1="248" x2="180" y2="312" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="288" fill="#94a3b8" font-size="11">enqueue</text>
  <line x1="410" y1="248" x2="410" y2="312" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="288" fill="#94a3b8" font-size="11">ORM</text>
  <line x1="500" y1="248" x2="640" y2="312" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="288" fill="#94a3b8" font-size="11">файлы</text>

  <!-- Redis -->
  <rect x="80" y="314" width="200" height="62" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="180" y="340" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Redis</text>
  <text x="180" y="360" fill="#94a3b8" font-size="12" text-anchor="middle">брокер + результаты</text>

  <!-- Postgres -->
  <rect x="310" y="314" width="200" height="62" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="410" y="340" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">PostgreSQL 16</text>
  <text x="410" y="360" fill="#94a3b8" font-size="12" text-anchor="middle">постоянное хранилище</text>

  <!-- Uploads -->
  <rect x="540" y="314" width="200" height="62" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="640" y="340" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">uploads volume</text>
  <text x="640" y="360" fill="#94a3b8" font-size="12" text-anchor="middle">артефакты команд</text>

  <!-- Redis -> Worker -->
  <line x1="180" y1="376" x2="180" y2="430" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="408" fill="#94a3b8" font-size="11">задачи</text>

  <!-- Worker -->
  <rect x="80" y="432" width="660" height="76" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="410" y="458" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Celery worker — автопроверки · sandbox-исполнение</text>
  <text x="410" y="482" fill="#94a3b8" font-size="12" text-anchor="middle">GitHub API · flake8 / radon · ffprobe · whisper · g++ / javac / python (sandbox)</text>
  <text x="410" y="500" fill="#64748b" font-size="11" text-anchor="middle">dev-режим (USE_CELERY=false): проверки через FastAPI BackgroundTasks, данные в SQLite</text>

  <!-- Worker -> Postgres write back -->
  <line x1="410" y1="432" x2="410" y2="378" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
</svg>
